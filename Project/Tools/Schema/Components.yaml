# Components.yaml
# SSOT definition for ECS Components

types:
  Transform:
    type: Component
    fields:
      - name: isEnabled
        type: uint32
      - name: parent
        type: uint32
        hide_in_editor: true
      - name: sortOrder
        type: float
        hide_in_editor: true
      - name: position
        type: float3
      - name: rotation
        type: float3
      - name: scale
        type: float3
      - name: world
        type: float4x4
        hide_in_editor: true

  MeshRenderer:
    type: Component
    fields:
      - name: isEnabled
        type: uint32
      - name: modelIndex
        type: uint32
        asset_type: Model
      - name: materialIndex
        type: uint32
        asset_type: Material
      - name: postProcessFlags
        type: uint32

  SkinnedMeshRenderer:
    type: Component
    fields:
      - name: isEnabled
        type: uint32
      - name: modelIndex
        type: uint32
        asset_type: Model
      - name: materialIndex
        type: uint32
        asset_type: Material
      - name: skeletonIndex
        type: uint32
      - name: postProcessFlags
        type: uint32
      - name: internalVertexOffset
        type: uint32

  ScriptComponent:
    type: Component
    fields:
      - name: isEnabled
        type: uint32
      - name: gcHandle
        type: uint64
        hide_in_editor: true
      - name: typeId
        type: uint32
        hide_in_editor: true

  Camera:
    type: Component
    fields:
      - name: isEnabled
        type: uint32
      - name: fov
        type: float
      - name: nearZ
        type: float
      - name: farZ
        type: float

  DirectionalLight:
    type: Component
    fields:
      - name: isEnabled
        type: uint32
      - name: color
        type: float3
      - name: intensity
        type: float
      - name: direction
        type: float3

  PointLight:
    type: Component
    fields:
      - name: isEnabled
        type: uint32
      - name: color
        type: float3
      - name: intensity
        type: float
      - name: radius
        type: float

  SpriteRenderer:
    type: Component
    fields:
      - name: isEnabled
        type: uint32
      - name: textureIndex
        type: uint32
        asset_type: Texture
      - name: color
        type: float4
      - name: size
        type: float2
      - name: isBillboard
        type: uint32

  Skybox:
    type: Component
    fields:
      - name: isEnabled
        type: uint32
      - name: textureIndex
        type: uint32
        asset_type: Texture

  Tag:
    type: Component
    fields:
      - name: isActive
        type: uint32
      - name: name
        type: string

  TextRenderer:
    type: Component
    fields:
      - name: isEnabled
        type: uint32
      - name: text
        type: string
      - name: fontIndex
        type: uint32
        asset_type: Font
      - name: color
        type: float4
      - name: size
        type: float
      - name: isScreenSpace
        type: uint32

  ParticleEmitter:
    type: Component
    fields:
      - name: isEnabled
        type: uint32
      - name: count
        type: uint32
      - name: speed
        type: float
      - name: speedRandom
        type: float
      - name: lifetime
        type: float
      - name: lifetimeRandom
        type: float
      - name: spreadAngle
        type: float
      - name: gravity
        type: float
      - name: startColor
        type: float4
      - name: endColor
        type: float4
      - name: startScale
        type: float
      - name: endScale
        type: float
      - name: modelIndex
        type: uint32
        asset_type: Model
      - name: textureIndex
        type: uint32
        asset_type: Texture
      - name: bufferIndex
        type: uint32
