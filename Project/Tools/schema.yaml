# schema.yaml
# SSOT definition for engine data structures

types:
  SceneData:
    type: ConstantBuffer
    fields:
      - name: viewProj
        type: float4x4
      - name: cameraPos
        type: float3
      - name: numPointLights
        type: uint32
      - name: dirLightIntensity
        type: float
      - name: dirLightColor
        type: float3
      - name: dirLightDirection
        type: float3
      - name: padding
        type: float
  
  InstanceData:
    type: StructuredBuffer
    fields:
      - name: world
        type: float4x4
      - name: baseColor
        type: float4
      - name: textureIndex
        type: uint32
      - name: vertexOffset
        type: uint32
      - name: padding
        type: float2 # 8 bytes padding (80 + 8 + 8 = 96)

  MaterialData:
    type: ConstantBuffer
    fields:
      - name: baseColor
        type: float4
  
  Transform:
    type: Component
    fields:
      - name: parent
        type: uint32 # Entity ID of the parent
      - name: position
        type: float3
      - name: rotation
        type: float3
      - name: scale
        type: float3
      - name: world
        type: float4x4 # Pre-computed world matrix

  MeshRenderer:
    type: Component
    fields:
      - name: modelIndex
        type: uint32
      - name: materialIndex
        type: uint32

  ScriptComponent:
    type: Component
    fields:
      - name: gcHandle
        type: uint64
      - name: typeId
        type: uint32

  Camera:
    type: Component
    fields:
      - name: fov
        type: float
      - name: nearZ
        type: float
      - name: farZ
        type: float

  DirectionalLight:
    type: Component
    fields:
      - name: color
        type: float3
      - name: intensity
        type: float
      - name: direction
        type: float3

  PointLight:
    type: Component
    fields:
      - name: color
        type: float3
      - name: intensity
        type: float
      - name: radius
        type: float

  PointLightData:
    type: StructuredBuffer
    fields:
      - name: position
        type: float3
      - name: intensity
        type: float
      - name: color
        type: float3
      - name: radius
        type: float

  SpriteRenderer:
    type: Component
    fields:
      - name: textureIndex
        type: uint32
      - name: color
        type: float4
      - name: size
        type: float2
      - name: isBillboard
        type: uint32 # bool equivalent

  SpriteData:
    type: StructuredBuffer
    fields:
      - name: world
        type: float4x4
      - name: color
        type: float4
      - name: textureIndex
        type: uint32
      - name: isBillboard
        type: uint32
      - name: padding
        type: float2

  Skybox:
    type: Component
    fields:
      - name: textureIndex
        type: uint32

  TextRenderer:
    type: Component
    fields:
      - name: text
        type: string
      - name: fontIndex
        type: uint32
      - name: color
        type: float4
      - name: size
        type: float
      - name: isScreenSpace
        type: uint32

  TextData:
    type: StructuredBuffer
    fields:
      - name: world
        type: float4x4
      - name: color
        type: float4
      - name: uvMin
        type: float2
      - name: uvMax
        type: float2
      - name: textureIndex
        type: uint32
      - name: padding
        type: uint32
