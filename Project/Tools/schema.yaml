# schema.yaml
# SSOT definition for engine data structures

types:
  SceneData:
    type: ConstantBuffer
    fields:
      - name: view
        type: float4x4
      - name: viewProj
        type: float4x4
      - name: cameraPos
        type: float3
      - name: numPointLights
        type: uint32
      - name: dirLightIntensity
        type: float
      - name: dirLightColor
        type: float3
      - name: dirLightDirection
        type: float3
      - name: screenWidth
        type: float
      - name: screenHeight
        type: float
      - name: nearZ
        type: float
      - name: farZ
        type: float
  
  InstanceData:
    type: StructuredBuffer
    fields:
      - name: world
        type: float4x4 # 64 bytes
      - name: aabbMin
        type: float4   # 16 bytes
      - name: aabbMax
        type: float4   # 16 bytes
      - name: baseColor
        type: float4   # 16 bytes
      - name: modelIndex
        type: uint32
      - name: textureIndex
        type: uint32
      - name: vertexOffset
        type: uint32
      - name: entityID
        type: uint32   # 16 bytes (Packed slot)
      - name: postProcessFlags
        type: uint32
      - name: unused_pad
        type: uint32
        count: 3       # Final 16 bytes (Total 128 + 16 = 144)

  MaterialData:
    type: ConstantBuffer
    fields:
      - name: baseColor
        type: float4
  
  Transform:
    type: Component
    fields:
      - name: parent
        type: uint32 # Entity ID of the parent
      - name: position
        type: float3
      - name: rotation
        type: float3
      - name: scale
        type: float3
      - name: world
        type: float4x4 # Pre-computed world matrix

  MeshRenderer:
    type: Component
    fields:
      - name: modelIndex
        type: uint32
      - name: materialIndex
        type: uint32
      - name: postProcessFlags
        type: uint32

  ScriptComponent:
    type: Component
    fields:
      - name: gcHandle
        type: uint64
      - name: typeId
        type: uint32

  Camera:
    type: Component
    fields:
      - name: fov
        type: float
      - name: nearZ
        type: float
      - name: farZ
        type: float

  DirectionalLight:
    type: Component
    fields:
      - name: color
        type: float3
      - name: intensity
        type: float
      - name: direction
        type: float3

  PointLight:
    type: Component
    fields:
      - name: color
        type: float3
      - name: intensity
        type: float
      - name: radius
        type: float

  PointLightData:
    type: StructuredBuffer
    fields:
      - name: position
        type: float3
      - name: intensity
        type: float
      - name: color
        type: float3
      - name: radius
        type: float

  SpriteRenderer:
    type: Component
    fields:
      - name: textureIndex
        type: uint32
      - name: color
        type: float4
      - name: size
        type: float2
      - name: isBillboard
        type: uint32 # bool equivalent

  SpriteData:
    type: StructuredBuffer
    fields:
      - name: world
        type: float4x4
      - name: color
        type: float4
      - name: textureIndex
        type: uint32
      - name: isBillboard
        type: uint32
      - name: entityID
        type: uint32
      - name: postProcessFlags
        type: uint32

  Skybox:
    type: Component
    fields:
      - name: textureIndex
        type: uint32

  TextRenderer:
    type: Component
    fields:
      - name: text
        type: string
      - name: fontIndex
        type: uint32
      - name: color
        type: float4
      - name: size
        type: float
      - name: isScreenSpace
        type: uint32

  TextData:
    type: StructuredBuffer
    fields:
      - name: world
        type: float4x4
      - name: color
        type: float4
      - name: uvMin
        type: float2
      - name: uvMax
        type: float2
      - name: textureIndex
        type: uint32
      - name: padding
        type: uint32

  ParticleEmitter:
    type: Component
    fields:
      - name: count
        type: uint32
      - name: speed
        type: float
      - name: speedRandom
        type: float # 0.0 to 1.0 variation
      - name: lifetime
        type: float
      - name: lifetimeRandom
        type: float # 0.0 to 1.0 variation
      - name: spreadAngle
        type: float # emission cone angle in degrees
      - name: gravity
        type: float
      - name: startColor
        type: float4
      - name: endColor
        type: float4
      - name: startScale
        type: float
      - name: endScale
        type: float
      - name: modelIndex
        type: uint32 # 0 for Sprite
      - name: textureIndex
        type: uint32
      - name: bufferIndex
        type: uint32 # Reserved for internal GPU buffer management

  ParticleGPUData:
    type: StructuredBuffer
    fields:
      - name: position
        type: float3
      - name: age
        type: float
      - name: velocity
        type: float3
      - name: maxLifetime
        type: float
      - name: color
        type: float4
      - name: rotation
        type: float3
      - name: scale
        type: float
      - name: modelIndex
        type: uint32
      - name: textureIndex
        type: uint32
      - name: entityID
        type: uint32
      - name: postProcessFlags
        type: uint32

  MeshInfo:
    type: StructuredBuffer
    fields:
      - name: vertexOffset
        type: uint32
      - name: indexOffset
        type: uint32
      - name: vertexCount
        type: uint32
      - name: indexCount
        type: uint32
