# schema.yaml
# SSOT definition for engine data structures

types:
  SceneData:
    type: ConstantBuffer
    fields:
      - name: viewProj
        type: float4x4
  
  InstanceData:
    type: StructuredBuffer
    fields:
      - name: world
        type: float4x4
      - name: baseColor
        type: float4
      - name: textureIndex
        type: uint32
      - name: padding
        type: float3 # 12 bytes padding (84 + 12 = 96)

  MaterialData:
    type: ConstantBuffer
    fields:
      - name: baseColor
        type: float4
  
  Transform:
    type: Component
    fields:
      - name: position
        type: float3
      - name: rotation
        type: float3
      - name: scale
        type: float3

  MeshRenderer:
    type: Component
    fields:
      - name: modelIndex
        type: uint32
      - name: materialIndex
        type: uint32
